<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="760" height="298" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Time per token before and after the AVX2 kernels, by where it goes</title>
<desc>Prefill with scalar kernels: 70.2 ms per token. Prefill with avx2 kernels: 8.0 ms per token. Decode with scalar kernels: 125.7 ms per token. Decode with avx2 kernels: 43.9 ms per token. The memory roofline for decode is 31.4 ms.</desc>
<rect width="760" height="298" fill="#ffffff"/>
<text x="24" y="32" font-size="17" font-weight="600" fill="#191919">AVX2 made prefill about 9x faster and decode about 3x; decode is held back by memory</text>
<text x="24" y="54" font-size="13" fill="#666666">Time per token on one rank (GPT-2 small, 32-token prompt, then 32 decoded tokens)</text>
