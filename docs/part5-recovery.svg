<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Time to rebuild a session after a rank fails, by session length</title>
<desc>Replay grows in step with session length, from 348 ms at 16 tokens to 11.0 s at 512 tokens. Checkpoint stays between 0 ms and 31 ms.</desc>
<rect width="760" height="420" fill="#ffffff"/>
<text x="64" y="32" font-size="17" font-weight="600" fill="#191919">Rebuilding a lost rank's cache: replay grows with the session, checkpoint does not</text>
<text x="64" y="54" font-size="13" fill="#666666">Time to rebuild one session on a replacement rank (2 ranks, GPT-2 small, 2-core machine, scalar code)</text>
<line x1="64" y1="76" x2="82" y2="76" stroke="#257de0" stroke-width="2" stroke-linecap="round"/>
<text x="88" y="80" font-size="12" fill="#191919">Replay: re-run the tokens</text>
<line x1="268.0" y1="76" x2="286.0" y2="76" stroke="#f47230" stroke-width="2" stroke-linecap="round"/>
<text x="292.0" y="80" font-size="12" fill="#191919">Checkpoint: copy the saved cache back</text>
<line x1="64" y1="364.0" x2="610" y2="364.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="368.0" font-size="12" fill="#666666" text-anchor="end">0 s</text>
<line x1="64" y1="319.3" x2="610" y2="319.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="323.3" font-size="12" fill="#666666" text-anchor="end">2 s</text>
<line x1="64" y1="274.7" x2="610" y2="274.7" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="278.7" font-size="12" fill="#666666" text-anchor="end">4 s</text>
<line x1="64" y1="230.0" x2="610" y2="230.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="234.0" font-size="12" fill="#666666" text-anchor="end">6 s</text>
<line x1="64" y1="185.3" x2="610" y2="185.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="189.3" font-size="12" fill="#666666" text-anchor="end">8 s</text>
<line x1="64" y1="140.7" x2="610" y2="140.7" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="144.7" font-size="12" fill="#666666" text-anchor="end">10 s</text>
<line x1="64" y1="96.0" x2="610" y2="96.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="100.0" font-size="12" fill="#666666" text-anchor="end">12 s</text>
<text x="81.1" y="384" font-size="12" fill="#666666" text-anchor="middle">16</text>
<text x="132.2" y="384" font-size="12" fill="#666666" text-anchor="middle">64</text>
<text x="200.5" y="384" font-size="12" fill="#666666" text-anchor="middle">128</text>
<text x="337.0" y="384" font-size="12" fill="#666666" text-anchor="middle">256</text>
<text x="610.0" y="384" font-size="12" fill="#666666" text-anchor="middle">512</text>
<text x="337.0" y="410" font-size="12" fill="#666666" text-anchor="middle">tokens in the session when the rank failed</text>
<polyline points="81.1,356.2 132.2,334.0 200.5,304.9 337.0,235.3 610.0,118.0" fill="none" stroke="#257de0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="81.1" cy="356.2" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>16 tokens: 348 ms</title></circle>
<circle cx="132.2" cy="334.0" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>64 tokens: 1.3 s</title></circle>
<circle cx="200.5" cy="304.9" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>128 tokens: 2.6 s</title></circle>
<circle cx="337.0" cy="235.3" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>256 tokens: 5.8 s</title></circle>
<circle cx="610.0" cy="118.0" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>512 tokens: 11.0 s</title></circle>
<polyline points="81.1,364.0 132.2,364.0 200.5,363.9 337.0,363.7 610.0,363.3" fill="none" stroke="#f47230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="81.1" cy="364.0" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>16 tokens: 0 ms</title></circle>
<circle cx="132.2" cy="364.0" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>64 tokens: 2 ms</title></circle>
<circle cx="200.5" cy="363.9" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>128 tokens: 6 ms</title></circle>
<circle cx="337.0" cy="363.7" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>256 tokens: 12 ms</title></circle>
<circle cx="610.0" cy="363.3" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>512 tokens: 31 ms</title></circle>
<text x="622.0" y="116.0" font-size="13" font-weight="600" fill="#191919">Replay</text>
<text x="622.0" y="133.0" font-size="13" fill="#191919">11.0 s</text>
<text x="622.0" y="351.3" font-size="13" font-weight="600" fill="#191919">Checkpoint</text>
<text x="622.0" y="368.3" font-size="13" fill="#191919">31 ms</text>
</svg>
