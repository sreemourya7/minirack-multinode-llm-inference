<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Time to rebuild a session after a rank fails, by session length</title>
<desc>Replay: re-run the tokens: 78 ms at 16 tokens, 2.2 s at 512. Checkpoint: copy the saved cache back: 1 ms at 16 tokens, 22 ms at 512.</desc>
<rect width="760" height="420" fill="#ffffff"/>
<text x="64" y="32" font-size="17" font-weight="600" fill="#191919">Rebuilding a lost rank's cache: replay grows with the session, checkpoint does not</text>
<text x="64" y="54" font-size="13" fill="#666666">Time to rebuild one session on a replacement rank (2 ranks, GPT-2 small)</text>
<line x1="64" y1="76" x2="82" y2="76" stroke="#257de0" stroke-width="2" stroke-linecap="round"/>
<text x="88" y="80" font-size="12" fill="#191919">Replay: re-run the tokens</text>
<line x1="268.0" y1="76" x2="286.0" y2="76" stroke="#f47230" stroke-width="2" stroke-linecap="round"/>
<text x="292.0" y="80" font-size="12" fill="#191919">Checkpoint: copy the saved cache back</text>
<line x1="64" y1="364.0" x2="584" y2="364.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="368.0" font-size="12" fill="#666666" text-anchor="end">0 s</text>
<line x1="64" y1="310.4" x2="584" y2="310.4" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="314.4" font-size="12" fill="#666666" text-anchor="end">0.5 s</text>
<line x1="64" y1="256.8" x2="584" y2="256.8" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="260.8" font-size="12" fill="#666666" text-anchor="end">1 s</text>
<line x1="64" y1="203.2" x2="584" y2="203.2" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="207.2" font-size="12" fill="#666666" text-anchor="end">1.5 s</text>
<line x1="64" y1="149.6" x2="584" y2="149.6" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="153.6" font-size="12" fill="#666666" text-anchor="end">2 s</text>
<line x1="64" y1="96.0" x2="584" y2="96.0" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="100.0" font-size="12" fill="#666666" text-anchor="end">2.5 s</text>
<text x="80.2" y="384" font-size="12" fill="#666666" text-anchor="middle">16</text>
<text x="129.0" y="384" font-size="12" fill="#666666" text-anchor="middle">64</text>
<text x="194.0" y="384" font-size="12" fill="#666666" text-anchor="middle">128</text>
<text x="324.0" y="384" font-size="12" fill="#666666" text-anchor="middle">256</text>
<text x="584.0" y="384" font-size="12" fill="#666666" text-anchor="middle">512</text>
<text x="324.0" y="410" font-size="12" fill="#666666" text-anchor="middle">tokens in the session when the rank failed</text>
<polyline points="80.2,355.6 129.0,334.9 194.0,311.0 324.0,259.1 584.0,129.7" fill="none" stroke="#257de0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="80.2" cy="355.6" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>Replay: re-run the tokens, 16 tokens: 78 ms</title></circle>
<circle cx="129.0" cy="334.9" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>Replay: re-run the tokens, 64 tokens: 271 ms</title></circle>
<circle cx="194.0" cy="311.0" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>Replay: re-run the tokens, 128 tokens: 494 ms</title></circle>
<circle cx="324.0" cy="259.1" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>Replay: re-run the tokens, 256 tokens: 979 ms</title></circle>
<circle cx="584.0" cy="129.7" r="4" fill="#257de0" stroke="#ffffff" stroke-width="2"><title>Replay: re-run the tokens, 512 tokens: 2.2 s</title></circle>
<polyline points="80.2,363.9 129.0,363.8 194.0,363.4 324.0,363.3 584.0,361.7" fill="none" stroke="#f47230" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="80.2" cy="363.9" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>Checkpoint: copy the saved cache back, 16 tokens: 1 ms</title></circle>
<circle cx="129.0" cy="363.8" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>Checkpoint: copy the saved cache back, 64 tokens: 2 ms</title></circle>
<circle cx="194.0" cy="363.4" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>Checkpoint: copy the saved cache back, 128 tokens: 6 ms</title></circle>
<circle cx="324.0" cy="363.3" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>Checkpoint: copy the saved cache back, 256 tokens: 7 ms</title></circle>
<circle cx="584.0" cy="361.7" r="4" fill="#f47230" stroke="#ffffff" stroke-width="2"><title>Checkpoint: copy the saved cache back, 512 tokens: 22 ms</title></circle>
<text x="596.0" y="365.7" font-size="13" fill="#191919"><tspan font-weight="600">Checkpoint</tspan> 22 ms</text>
<text x="596.0" y="133.7" font-size="13" fill="#191919"><tspan font-weight="600">Replay</tspan> 2.2 s</text>
</svg>
